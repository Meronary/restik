<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FOREVER Restaurant — Бронирование</title>
    <link rel="icon" href="Content/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <a class="navbar-brand brand-gold" href="index.html">FOREVER</a>
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Главная</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="menu.html">Меню</a>
            </li>
            <li class="nav-item active">
                <a class="nav-link" href="booking.html">О нас и Бронь</a>
            </li>
        </ul>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-8">
                <div class="card my-3">
                    <div class="card-body">
                        <p class="subtitle-gold mb-1">Резерв</p>
                        <h2>Забронировать столик</h2>
                        <p>Оставьте заявку, и мы подготовим для вас идеальный вечер при свечах.</p>

                        <form>
                            <div class="form-group">
                                <label>Ваше имя:</label>
                                <input type="text" class="form-control dark-input" placeholder="Введите имя">
                            </div>

                            <div class="form-group">
                                <label>Телефон:</label>
                                <input type="text" class="form-control dark-input" placeholder="+7 (999) 000-00-00">
                            </div>

                            <div class="form-group">
                                <label>Количество гостей:</label>
                                <select class="form-control dark-input">
                                    <option>2 гостя (Столик для влюблённых)</option>
                                    <option>4 гостя</option>
                                    <option>6 гостей</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Пожелания к вечеру:</label>
                                <textarea class="form-control dark-input" rows="3" placeholder="Например: столик у окна, живая музыка..."></textarea>
                            </div>

                            <button type="submit" class="btn-gold">Отправить заявку</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-4">
                <div class="card my-3">
                    <div class="card-body">
                        <h5 class="subtitle-gold">О нас и Контакты</h5>
                        <p>
                            <strong>FOREVER</strong> — ресторан с приватной атмосферой и авторской кухней.
                        </p>
                        <hr style="border-color: #333;">
                        <p>
                            <strong>Часы работы:</strong><br>
                            Ежедневно с 12:00 до 00:00
                        </p>
                        <p>
                            <strong>Телефон:</strong><br>
                            8 (800) 555-35-35
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
